<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#13201A">
<meta name="description" content="A cozy animal logic puzzle. Tester build.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nestled">
<title>Nestled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
/* Layout: one phone-width game screen — the illustrated trail — with the puzzle and every other moment as overlays and sheets. Single committed dusk look. */
:root{
  --night:#13201A; --panel:#1C2E25; --tile:#22382D; --line:#2B4536; --edge:#3A5446;
  --ink:#EDE6D3; --muted:#9DB0A3; --dim:#5E7A69; --pebble:#3E5A4A;
  --gold:#E3B341; --bad:#F07A6A;
  --display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --body:'DM Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay{padding-top:max(16px,env(safe-area-inset-top,0px))!important;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))!important}
button,.tile,.cell{-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{font-family:var(--body)}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
.screen{position:relative;flex:1;min-height:0;overflow-y:auto;padding-block:12px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen > *{flex-shrink:0}
#scr-trail{padding-top:0;gap:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spacer{margin-left:auto}
.iconbtn{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--edge);background:transparent;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}
.iconbtn svg{width:19px;height:19px}
.primary{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--gold);color:var(--night);font-weight:800;font-size:15px}
.secondary{min-height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--edge);background:transparent;font-weight:700;font-size:14px}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.panel{background:var(--tile);border-radius:16px;padding:14px}
.plusbadge{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--night);background:var(--gold);padding:3px 7px;border-radius:6px}

/* trail */
.tbar{position:sticky;top:0;z-index:4;background:var(--night);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.unit{display:flex;flex-direction:column}
.unitbar{position:sticky;top:62px;z-index:3;background:rgba(15,25,20,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(237,230,211,.1);border-radius:18px;padding:8px 8px 8px 8px;display:flex;align-items:center;gap:10px;margin-bottom:-60px}
.emblem{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:0;background:var(--hc);display:flex;align-items:center;justify-content:center;color:var(--hl);padding:0}
.emblem svg{width:22px;height:22px}
.ut{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--hl)}
.unitbar h3{font-size:19px;color:#F6F1E4}
.lineupbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:2px 4px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--hl)}
.faces{display:flex}
.faces i{width:28px;height:28px;border-radius:50%;background:var(--tile);border:2px solid var(--hc);display:flex;align-items:center;justify-content:center;margin-left:-8px}
.faces i:first-child{margin-left:0}
.faces svg{width:20px;height:20px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding-block:96px 44px;border-radius:26px;overflow:clip;background:var(--hc);margin-bottom:16px;isolation:isolate}
.path.soon{min-height:150px;justify-content:center;padding-inline:24px}
.path svg.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.soontxt{position:relative;z-index:1;text-align:center;font-size:14px;line-height:1.45;color:#E8F0F5;background:rgba(20,30,40,.55);padding:10px 14px;border-radius:12px}
.locknote{position:relative;z-index:2;font-size:13px;font-weight:700;color:#F6F1E4;background:rgba(10,16,12,.7);padding:8px 12px;border-radius:10px;margin-top:-50px}
.stopwrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.stopwrap.cur{margin-top:30px}
.unit[data-hab="forest"]{--face:repeating-radial-gradient(circle at 50% 50%,#A97A4A 0 2.5px,#8A5A3A 2.5px 6px);--rim:#5E3D25;--lip:#2B1D12}
.unit[data-hab="wetlands"]{--face:conic-gradient(from 190deg,#2F6B78 0 30deg,#4F9450 30deg 360deg);--rim:#2F6B3A;--lip:#0E2A30}
.unit[data-hab="snow"]{--face:#C9D8E4;--rim:#8FA3B3;--lip:#4E6476}
.stop{position:relative;width:64px;height:64px;border-radius:50%;border:3px solid var(--rim);background:var(--face);box-shadow:0 5px 0 var(--lip),0 10px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:0}
.stop .disc{width:34px;height:34px;border-radius:50%;background:rgba(10,16,12,.62);color:#F6F1E4;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:17px}
.stop .disc svg{width:19px;height:19px}
.stop.done .disc{background:var(--gold);color:#13201A}
.stop.locked{filter:grayscale(.75) brightness(.6);cursor:default}
.stop.side{border-radius:18px;width:56px;height:56px;transform:rotate(45deg)}
.stop.side .disc{transform:rotate(-45deg)}
.stop.fire{--face:radial-gradient(circle,#5A3A22 0 45%,#3B2617 46%);--rim:#7A5236;--lip:#1E130A;width:58px;height:58px}
.stop.fire .disc{background:transparent;width:40px;height:40px}
.stop.fire .disc svg{width:36px;height:36px}
.stop.fire.open{animation:fireglow 2s ease-in-out infinite}
@keyframes fireglow{0%,100%{box-shadow:0 5px 0 var(--lip),0 0 18px rgba(232,131,58,.45)}50%{box-shadow:0 5px 0 var(--lip),0 0 34px rgba(232,131,58,.75)}}
.stop:not(.locked):active{translate:0 3px}
.cur .stop{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 5px 0 var(--lip),0 0 0 5px rgba(244,226,122,.22),0 0 20px rgba(244,226,122,.35)}50%{box-shadow:0 5px 0 var(--lip),0 0 0 9px rgba(244,226,122,.16),0 0 34px rgba(244,226,122,.55)}}
.startbub{position:absolute;bottom:calc(100% + 12px);background:#F3E9D2;color:#3B2617;font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.08em;padding:6px 12px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 0 #A88B5E;animation:bob 1.8s ease-in-out infinite}
.startbub::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#F3E9D2}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-3deg) translateY(-4px)}}
.slbl{font-size:10px;font-weight:800;letter-spacing:.1em;color:#F6F1E4;background:rgba(10,16,12,.62);padding:4px 8px;border-radius:6px;white-space:nowrap}
.campfire{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:14px}
.campfire .fire{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:#2E2219;display:flex;align-items:center;justify-content:center}
.campfire .fire svg{width:30px;height:30px}
.campfire .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.campfire .txt b{font-size:15px}
.campfire .txt span{font-size:13px;color:var(--muted)}
.campfire .primary,.campfire .secondary{min-height:42px;padding:0 16px}
.campfire .fire{position:relative;overflow:visible}
.campfire .fire svg{transform:scale(var(--fs,1));transform-origin:50% 80%}
.streakn{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--night);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.streakline{font-size:12px;font-weight:800;color:var(--gold)}
.cftop{display:flex;align-items:center;gap:10px}
.cftop .lanterns{flex-direction:column;gap:2px}
.cftop .lanterns i{width:18px;height:18px}
.gdots{display:flex;gap:3px}
.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--gold)}
.mini.giftic svg{width:100%;height:100%}
.cffoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.giftpill{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px 0 6px;border-radius:18px;border:1.5px solid var(--edge);background:transparent;font-size:13px;font-weight:800;color:var(--muted)}
.giftpill .gifticon{width:26px;height:26px;display:flex}
.giftpill .gifticon svg{width:100%;height:100%}
.giftpill.ready{border-color:var(--gold);color:var(--ink)}
.giftpill.ready .gifticon{animation:hop 1.6s ease-in-out infinite}
[hidden]{display:none!important}
.lanterns{display:inline-flex;gap:1px}
.lanterns i{width:16px;height:16px;color:#3A5446;display:flex}
.lanterns i.on{color:#F4D67A}
.lanterns svg{width:100%;height:100%}
.giftmini.idle{animation:none;opacity:.45}
.expbox{background:var(--hc);border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid rgba(237,230,211,.1)}
.exphead{display:flex;gap:10px;align-items:center;padding:12px 12px 8px}
.exphead .emblem{width:40px;height:40px}
.exphead .ut{flex:1;min-width:0;gap:2px}
.exphead b{font-family:var(--display);font-size:18px;color:#F6F1E4}
.exphead .eb{font-size:12px;color:rgba(246,241,228,.75);line-height:1.35}
.exprew{width:56px;flex-shrink:0;border-radius:12px;border:2px solid var(--rar);background:rgba(10,16,12,.45);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:2px}
.exprew svg{width:36px;height:36px}
.exprew small{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--rar)}
.expfoot{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;background:rgba(10,16,12,.35)}
.expfoot .muted{color:rgba(246,241,228,.75)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(246,241,228,.2)}
.dots i.on{background:var(--hl)}
.primary.sm{min-height:38px;padding:0 16px;font-size:14px}
.habcard{position:relative}
.visit{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;background:rgba(10,16,12,.78);border:1px solid var(--gold);border-radius:14px;padding:3px 9px 3px 4px;font-size:11px;font-weight:800;color:var(--gold)}
.visit svg{width:20px;height:20px}
.vbadge{position:absolute;top:-12px;right:-14px;width:30px;height:30px;border-radius:50%;background:#13201A;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;animation:hop 1.8s ease-in-out infinite}
.vbadge svg{width:22px;height:22px}
.stop.side .vbadge{transform:rotate(-45deg)}
.goals{display:flex;flex-direction:column;gap:6px;text-align:left}
.goal{display:grid;grid-template-columns:26px 1fr 54px;align-items:center;gap:10px;background:var(--tile);border-radius:10px;padding:8px 10px;font-size:13px}
.gic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.gic svg{width:100%;height:100%}
.btncol{display:flex;flex-direction:column;gap:10px;width:100%}
.mini.lant{color:#F4D67A}
.gcal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gday{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--tile);border-radius:14px;padding:10px 4px;border:2px solid transparent;text-align:center}
.gday.big{grid-column:span 2;background:linear-gradient(160deg,#3A3018,var(--tile))}
.gday.today{border-color:var(--gold)}
.gday.claimed{opacity:.55}
.gd{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.gi{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.gi svg{width:26px;height:26px}
.gl{font-size:11px;font-weight:700;line-height:1.2}
.xpbig{font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold)}
.minicard{width:18px;height:24px;border-radius:4px;border:2px solid var(--gold)}
.giftem{background:#3A2218}
.giftem svg{width:28px;height:28px}
.sharecard{background:linear-gradient(170deg,var(--hc),#13201A);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(237,230,211,.15)}
.scrow{display:flex;align-items:center;gap:10px}
.scrow .ut b{font-family:var(--display);font-size:17px}
.scrow .ut span{font-size:12px;color:rgba(246,241,228,.75)}
.avatar.sm2{width:40px;height:40px}
.scmid{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--hl)}
.scmid .emblem{width:34px;height:34px}
.scstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.scstats div{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(10,16,12,.4);border-radius:12px;padding:10px 4px}
.scstats b{font-family:var(--display);font-size:22px}
.scstats span{font-size:11px;font-weight:700;color:rgba(246,241,228,.7)}
.scl{display:flex;gap:1px}
.scl i{width:18px;height:18px;color:#3A5446;display:flex}
.scl i.on{color:#8CC084}
.scl svg{width:100%;height:100%}
.schint{font-size:12px;font-weight:700;color:rgba(246,241,228,.8)}
.scfoot{font-size:12px;color:rgba(246,241,228,.65)}
.moon{width:54px;height:54px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF4C8,#E3B341 60%,#9C7A22);box-shadow:0 0 30px rgba(227,179,65,.45)}
.giftmini{width:42px;height:42px;flex-shrink:0;border:0;padding:0;background:transparent;animation:hop 1.6s ease-in-out infinite}
.giftmini svg{width:100%;height:100%}
.giftb{position:absolute;top:-14px;right:-30px;width:44px;height:44px;border:0;padding:0;background:transparent;animation:hop 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.giftb svg{width:100%;height:100%}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.deco{position:absolute;z-index:1;width:64px;height:64px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.deco svg{width:100%;height:100%}
.ff{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

/* puzzle */
header.pz{display:flex;align-items:center;gap:10px}
header.pz .t{display:flex;flex-direction:column;gap:3px;min-width:0}
header.pz .t b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.sub{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.moons{display:flex;gap:3px}
.moons i{width:10px;height:10px;border-radius:50%;border:1.6px solid var(--dim);box-sizing:border-box}
.moons i.on{background:var(--gold);border-color:var(--gold)}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--night);background:var(--gold);padding:2px 7px;border-radius:6px}
.board{box-sizing:border-box;max-width:100%;background:var(--bBg);border:1px solid var(--bLine);border-radius:24px;padding:12px 12px 14px 4px}
.skin-moss{--bBg:#1C2E25;--bLine:#2B4536;--bPeb:#3E5A4A;--bClue:#5E7A69;--bInk:#EDE6D3}
.skin-lagoon{--bBg:#15303A;--bLine:#24505E;--bPeb:#2F6B78;--bClue:#4A8796;--bInk:#E3F1F2}
.skin-snow{--bBg:#DCE6EE;--bLine:#B9C8D4;--bPeb:#8FA3B3;--bClue:#6F8597;--bInk:#1D2B35}
.grid{display:grid}
.clue{display:flex;align-items:center;justify-content:center;padding:4px 0}
.clue span{width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:1.6px solid var(--bClue);color:var(--bInk);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:background .2s,border-color .2s}
.clue.done span{background:var(--gold);border-color:var(--gold);color:#13201A}
.clue.over span{border-color:var(--bad);color:var(--bad)}
.cell{aspect-ratio:1;max-width:100%;border:0;border-right:1px solid var(--bLine);border-bottom:1px solid var(--bLine);background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.cell.lastc{border-right:0}.cell.lastr{border-bottom:0}
.cell svg.home{width:74%;height:auto}
.pebble{width:24%;aspect-ratio:1.25;border-radius:50%;background:var(--bPeb)}
.tile{width:80%;aspect-ratio:.87;box-sizing:border-box;border-radius:8px;border:2px solid var(--rar);background:var(--tile);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:drop .22s ease-out}
.tile.still{animation:none}
.tile.wild{border-style:dashed}
.tile svg{width:76%;height:auto}
.tile.hinted{box-shadow:0 0 0 2px var(--gold),0 4px 10px rgba(0,0,0,.4)}
.tile.bad{border-color:var(--bad);border-style:solid;box-shadow:0 0 0 3px rgba(240,122,106,.35)}
@keyframes drop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
.tools{display:flex;gap:8px}
.tool{flex:1;min-width:0;min-height:44px;padding:0 6px;border-radius:22px;border:1.5px solid var(--edge);background:transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:13px}
.tool svg{width:16px;height:16px;flex-shrink:0}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.tool .pebble{width:12px;flex-shrink:0;background:var(--pebble)}
.party{display:flex;flex-direction:column;gap:6px}
.handhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.handhead b{font-family:var(--display);font-weight:800;font-size:15px}
.handhead span{font-size:12px;font-weight:700;color:var(--muted)}
.board.tight .clue{padding:1px 0}
.board.tight .clue span{width:19px;height:19px;font-size:11px}
.board.tight{padding:8px 8px 10px 2px}
.hand.small .hcard .rt{display:none}
.hand.small .hcard{padding:5px;gap:3px}
.hand.small .hcard .nm,.hand.small .hcard .left{font-size:11px}
.hand.small .hcard .foot svg.home{width:18px}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding-top:8px}
.hcard{width:31%;max-width:112px;aspect-ratio:.74;box-sizing:border-box;border-radius:14px;border:2.5px solid var(--rar);background:var(--panel);padding:7px;display:flex;flex-direction:column;gap:5px;transition:transform .18s,box-shadow .18s;text-align:left}
.hcard.wild{border-style:dashed}

  const out=[];

    const size=(pos===1||pos===5)?Math.max(5,N-1):pos===4?Math.min(8,N+1):N;
    out.push({id:h.id+'-'+i,hab:h.id,i,num:i,kind:i%6===0?'camp':'stop',N:size,moons:Math.max(1,Math.min(4,size-4))});

/* ---------- generator (only boards with exactly one solution) ---------- */
function countBoards(N,homes,rows,cols){
  const hl=[...homes].map(([k,sp])=>{const r=Math.floor(k/N),c=k%N;return{sp,cands:n4(N,r,c).map(([a,b])=>a*N+b).filter(x=>!homes.has(x))}}).sort((a,b)=>a.cands.length-b.cands.length);
  const at=new Array(N*N).fill(null),rc=new Array(N).fill(0),cc=new Array(N).fill(0),seen=new Set();let steps=0;
  (function rec(i){
    if(seen.size>1||steps++>400000)return;
    if(i===hl.length){for(let r=0;r<N;r++)if(rc[r]!==rows[r])return;for(let c=0;c<N;c++)if(cc[c]!==cols[c])return;seen.add(at.map(v=>v||'.').join(','));return}
    for(const k of hl[i].cands){
      if(at[k])continue;const r=Math.floor(k/N),c=k%N;
      if(rc[r]>=rows[r]||cc[c]>=cols[c])continue;
      if(n8(N,r,c).some(([a,b])=>at[a*N+b]))continue;
      at[k]=hl[i].sp;rc[r]++;cc[c]++;rec(i+1);at[k]=null;rc[r]--;cc[c]--;
    }
  })(0);
  return steps>400000?2:seen.size;
}
function generate(N,species){
  const K=SIZES[N].K;
  for(;;){
    const homes=new Map(),sol=new Map(),sps=shuffle(Array.from({length:K},(_,i)=>species[i%species.length]));
    let i=0,fails=0;
    while(i<K&&fails<400){
      const r=rnd(N),c=rnd(N),k=r*N+c;
      if(homes.has(k)||sol.has(k)||n8(N,r,c).some(([x,y])=>sol.has(x*N+y))){fails++;continue}
      const opts=n4(N,r,c).filter(([x,y])=>!homes.has(x*N+y)&&!sol.has(x*N+y));
      if(!opts.length){fails++;continue}
      const [hr,hc]=opts[rnd(opts.length)];
      sol.set(k,sps[i]);homes.set(hr*N+hc,sps[i]);i++;
    }
    if(i<K)continue;
    const rows=new Array(N).fill(0),cols=new Array(N).fill(0);
    for(const k of sol.keys()){rows[Math.floor(k/N)]++;cols[k%N]++}
    if(countBoards(N,homes,rows,cols)===1)return {N,homes,sol,rows,cols};
  }
}

// size the board and lineup cards so the whole puzzle screen fits without scrolling
function fitPuzzle(){
  const scr=$('scr-puzzle');if(!scr||$('puzzle').hidden)return;
  const board=scr.querySelector('.board'),hand=scr.querySelector('.hand'),grid=board&&board.querySelector('.grid');if(!board)return;
  const N=S?S.p.N:6,cards=[...scr.querySelectorAll('.hcard')];
  const setCards=w=>{cards.forEach(c=>c.style.maxWidth=w+'px');hand.classList.toggle('small',w<100)};
  const setBoard=bw=>{const full=bw>=W;board.style.width=full?'':bw+'px';board.style.margin=full?'':'0 auto';
    const cell=((full?W:bw)-16-28)/N,tight=cell<34;board.classList.toggle('tight',tight);grid.style.gridTemplateColumns=(tight?'22px':'28px')+' repeat('+N+',minmax(0,1fr))'};
  const W=scr.clientWidth,H=scr.clientHeight;

  let cw=Math.round(Math.max(130,Math.min(152,H*.19))*.74);setCards(cw);setBoard(W);

function renderTools(){

// cells that could still hold an animal, given what's on the board
function openCell(k){
  const {p,player}=S,N=p.N,r=Math.floor(k/N),c=k%N;
  if(p.homes.has(k)||player.has(k))return false;
  if(n8(N,r,c).some(([a,b])=>{const v=player.get(a*N+b);return v&&v!=='pebble'}))return false;
  return n4(N,r,c).some(([a,b])=>{const sp=p.homes.get(a*N+b);return sp&&placed(sp)<needed(sp)});
}
function renderBoard(){
  const {p,player}=S,N=p.N;
  const rc=new Array(N).fill(0),cc=new Array(N).fill(0);
  for(const [k,v] of player)if(v!=='pebble'){rc[Math.floor(k/N)]++;cc[k%N]++}
  for(let r=0;r<N;r++){const e=$('rc'+r);e.classList.toggle('done',rc[r]===p.rows[r]);e.classList.toggle('over',false)}
  for(let c=0;c<N;c++){const e=$('cc'+c);e.classList.toggle('done',cc[c]===p.cols[c]);e.classList.toggle('over',false)}
  for(let k=0;k<N*N;k++){
    const b=$('cell'+k),r=Math.floor(k/N),c=k%N,v=player.get(k),prev=b.dataset.v||'';
    b.dataset.v=v||'';
    if(p.homes.has(k)){
      const sp=p.homes.get(k);
      b.innerHTML=HOMESVG[sp];b.setAttribute('aria-label',CARD[sp].name+' '+CARD[sp].home);continue}
    if(!v){b.innerHTML='';b.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+', empty');continue}
    if(v==='pebble'){b.innerHTML='<span class="pebble"></span>';b.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+', ruled out');continue}
    const touching=n8(N,r,c).some(([a,bb])=>{const w=player.get(a*N+bb);return w&&w!=='pebble'});
    const homeless=!n4(N,r,c).some(([a,bb])=>p.homes.get(a*N+bb)===v);
    const bad=touching||homeless,L=look(v);
    b.innerHTML='<span class="tile'+(bad?' bad':'')+(S.hinted.has(k)?' hinted':'')+(prev===v?' still':'')+'" style="--rar:'+L.color+'">'+art(v,true)+'</span>';
    b.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+', '+CARD[v].name+(bad?', breaks a rule':''));
  }
  renderTools();
  const L=$('lives');if(L){L.innerHTML=[0,1,2].map(i=>'<i class="'+(i<S.lives?'on':'')+'">'+ICON.leafLife+'</i>').join('');L.setAttribute('aria-label',S.lives+' of 3 lives left')}
}
function loseLife(k,sp){
  S.lives--;renderBoard();
  const b=$('cell'+k);b.innerHTML='<span class="tile wrong" style="--rar:#F07A6A">'+art(sp,true)+'</span>';b.dataset.v='';
  sfx('wrong');if(st.prefs.haptics&&navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  setTimeout(()=>{if(!S||S.done)return;renderBoard();if(S.lives<=0)outOfLives();else say('Not there. '+S.lives+' '+(S.lives===1?'life':'lives')+' left.')},600);
}
function outOfLives(){
  S.done=true;resetStreaksOnFail();
  ov('<div class="sheet center" role="dialog" aria-label="Out of lives"><h2>Out of lives</h2><p class="muted">Three animals went to the wrong spot. The board starts over, same puzzle, fresh lives.</p><button class="primary" data-act="restartBoard">Try again</button><button class="secondary" data-act="leave">Back to the trail</button></div>');
}
function setCell(k,v){S.undo.push([k,S.player.get(k)]);if(v)S.player.set(k,v);else S.player.delete(k)}
function tapCell(k){
  if(S.done)return;
  const {p}=S;
  if(p.homes.has(k)){const sp=p.homes.get(k);say('A '+CARD[sp].name.toLowerCase()+' '+CARD[sp].home+'. Its '+CARD[sp].name.toLowerCase()+' goes right beside it.');return}
  const cur=S.player.get(k),t=S.tool;
  if(t==='pebble'){if(cur!=='pebble')S.peb++;setCell(k,cur==='pebble'?null:'pebble')}
  else if(cur===t)setCell(k,null);
  else{if(needed(t)-placed(t)<=0){say('All '+CARD[t].name.toLowerCase()+'s are placed. Tap one to pick it up.');return}
    if(p.sol.get(k)!==t){loseLife(k,t);return}
    setCell(k,t);sfx('place');
    if(st.prefs.autoPebble){const N=p.N,g=Date.now()+Math.random();n8(N,Math.floor(k/N),k%N).forEach(([a,b])=>{const q=a*N+b;if(!p.homes.has(q)&&!S.player.has(q)){S.undo.push([q,undefined,g]);S.player.set(q,'pebble')}});S.undo.push([k,'__mark__',g])}}

}
function doHint(){
  const {p,player}=S;
  for(const [k,v] of player){
    if(v==='pebble'&&p.sol.has(k)){setCell(k,null);S.hints++;renderBoard();say('Hint: that pebble was covering a cell that needs an animal.');return}
    if(v!=='pebble'&&p.sol.get(k)!==v){setCell(k,null);S.hints++;renderBoard();say('Hint: removed a misplaced '+CARD[v].name.toLowerCase()+'.');return}
  }
  const miss=[...p.sol].filter(([k])=>!player.has(k));if(!miss.length)return;
  const [k,sp]=miss[rnd(miss.length)];setCell(k,sp);S.hinted.add(k);S.hints++;renderBoard();check();
  if(!S.done)say('Hint: placed a '+CARD[sp].name.toLowerCase()+' for you.');
}
// a win is any placement that follows every rule
function solvedByRules(){
  const {p,player}=S,N=p.N,animals=[...player].filter(([,v])=>v!=='pebble');
  if(animals.length!==p.homes.size)return false;
  const rc=new Array(N).fill(0),cc=new Array(N).fill(0);
  for(const [k] of animals){rc[Math.floor(k/N)]++;cc[k%N]++}
  for(let i=0;i<N;i++)if(rc[i]!==p.rows[i]||cc[i]!==p.cols[i])return false;
  for(const [k] of animals){const r=Math.floor(k/N),c=k%N;if(n8(N,r,c).some(([a,b])=>{const v=player.get(a*N+b);return v&&v!=='pebble'}))return false}
  const homes=[...p.homes],match=new Map();
  const tryHome=(hi,seen)=>{const [hk,sp]=homes[hi],r=Math.floor(hk/N),c=hk%N;
    for(const [a,b] of n4(N,r,c)){const k=a*N+b;if(player.get(k)!==sp||seen.has(k))continue;seen.add(k);if(!match.has(k)||tryHome(match.get(k),seen)){match.set(k,hi);return true}}return false};
  for(let i=0;i<homes.length;i++)if(!tryHome(i,new Set()))return false;
  return true;
}
function check(){
  if(solvedByRules()){S.done=true;setTimeout(finish,350);return}
  let a=0;for(const v of S.player.values())if(v!=='pebble')a++;
  if(a===S.p.homes.size)say('Every animal is out, but something breaks a rule. Look for red frames or clues.');
}

/* ---------- rewards: win → reveal → evolve ---------- */
function rollRar(boost){const r=Math.random()*(boost?0.45:1);return r<0.04?'L':r<0.15?'E':r<0.45?'R':'C'}
function packFor(hab,n,boost){
  return Array.from({length:n},()=>{
    const h=hab||HABS[Math.floor(Math.random()*HABS.length)].id;
    let rar=rollRar(boost),pool=CARDS.filter(c=>c.hab===h&&!c.basic&&c.rar===rar);
    if(!pool.length)pool=CARDS.filter(c=>c.hab===h&&!c.basic);

  });
}
function grant(list){

    const o=st.owned[c.id];

  });

function chalDesc(c){const ch=c.chal;return ch.text+'.'+(ch.scope==='any'?'':' Counts while it\'s in your '+HAB[c.hab].name+' lineup.')+(ch.type==='streak'?' A miss, or running out of lives, resets the streak.':'')+(ch.type==='day'?' Counts once per day.':'')}
function chalLine(sp,extra){const c=CARD[sp],o=st.owned[sp];return '<span class="mini">'+art(sp,true)+'</span><span style="flex:1"><b>'+c.name+'</b> '+(extra||('challenge '+o.evoP+'/'+c.chal.need))+'</span><span class="bar" style="max-width:70px"><i style="width:'+(o.evoP/c.chal.need*100)+'%"></i></span>'}
function progressChallenges(run,n,lines){
  const ids=new Set(n.kind==='daily'?[]:S.species);CARDS.forEach(c=>{if(c.chal.scope==='any')ids.add(c.id)});
  ids.forEach(sp=>{const o=st.owned[sp],c=CARD[sp],ch=c.chal;if(!o||o.evo||o.evoP>=ch.need)return;
    const res=ch.test(run,S.species.includes(sp)?needed(sp):0);let inc=0;
    if(ch.type==='count')inc=res||0;
    else if(ch.type==='day'){if(res&&o.lastDay!==today()){inc=1;o.lastDay=today()}}
    else if(ch.type==='streak'&&!res){if(o.evoP>0){o.evoP=0;lines.push(chalLine(sp,'streak reset · 0/'+ch.need))}return}
    else inc=res?1:0;
    if(inc>0){o.evoP=Math.min(ch.need,o.evoP+inc);lines.push(chalLine(sp))}});
}
function resetStreaksOnFail(){S.species.forEach(sp=>{const o=st.owned[sp],ch=CARD[sp].chal;if(o&&!o.evo&&ch.type==='streak'&&o.evoP>0&&o.evoP<ch.need){o.evoP=0}});save()}
function pendingEvos(){return CARDS.filter(c=>{const o=st.owned[c.id];return o&&!o.evo&&o.evoP>=c.chal.need}).map(c=>c.id)}
let FLOW=null;

    else{reward=g.n+(g.t==='card'&&st.plus?1:0);boost=!!g.boost;label='Day '+(gi+1)+' gift';lines.push('<span class="mini giftic">'+ICON.gift+'</span><span style="flex:1"><b>Day '+(gi+1)+' gift</b> · '+(g.label||(reward>1?reward+' cards':'a card'))+'</span>'+dots)}}
  else if(n.kind==='exp'){const e=expState();xp+=20;if(n.expI===e.done){e.done++;if(e.done===5&&!e.got){e.got=true;special.push(expTheme().reward);label='Expedition reward'}}}

  if(n.kind==='daily'){const sk=streaks();if(sk.cur>0&&sk.cur%7===0&&st.lanterns<2){st.lanterns++;lines.push('<span class="mini lant">'+ICON.lantern+'</span><span style="flex:1"><b>Streak lantern earned</b> · protects your streak if you miss a day</span>')}}

/* streak: solved days count, lantern-protected days bridge the gap */
function streaks(){
  const t=dayNum(nowDate());let n=solvedOn(numToKey(t))?t:t-1,cur=0;
  while(st.daily[numToKey(n)]){if(solvedOn(numToKey(n)))cur++;n--}
  const keys=Object.keys(st.daily).map(keyToNum).sort((a,b)=>a-b);let best=0,run=0,prev=null;
  keys.forEach(k=>{run=(prev!==null&&k===prev+1)?run:0;if(solvedOn(numToKey(k)))run++;best=Math.max(best,run);prev=k});
  return{cur,best:Math.max(best,cur)};
}
function protectStreak(){
  const t=dayNum(nowDate());if(st.protChecked===t)return;st.protChecked=t;
  const solved=Object.keys(st.daily).filter(solvedOn).map(keyToNum).filter(k=>k<t);
  if(!solved.length){save();return}
  const last=Object.keys(st.daily).map(keyToNum).filter(k=>k<t).sort((a,b)=>b-a)[0];
  const gap=t-1-last;
  if(gap>0&&gap<=st.lanterns){for(let i=1;i<=gap;i++)st.daily[numToKey(last+i)]={protected:true};st.lanterns-=gap;st.lanternUsed=gap}
  save();
}

const CHAL_SHORT={basic:'perfect, hint-free win',C:'win under 2 minutes',R:'clear a 7×7 or bigger board',E:'clear a side path',L:'perfect, hint-free win'};
function goalRow(icon,text,frac){return '<div class="goal">'+icon+'<span>'+text+'</span><span class="bar"><i style="width:'+Math.round(Math.max(.04,frac)*100)+'%"></i></span></div>'}
function nearGoals(n){
  const out=[];
  const ev=S.species.map(sp=>({sp,o:st.owned[sp],c:CARD[sp]})).filter(x=>x.o&&!x.o.evo&&x.o.evoP<x.c.chal.need).sort((a,b)=>(b.o.evoP/b.c.chal.need)-(a.o.evoP/a.c.chal.need))[0];
  if(ev){out.push(goalRow('<span class="gic">'+art(ev.sp,true)+'</span>',ev.c.name+' evolves: '+ev.c.chal.text.charAt(0).toLowerCase()+ev.c.chal.text.slice(1)+' ('+ev.o.evoP+'/'+ev.c.chal.need+')',ev.o.evoP/ev.c.chal.need))}
  if(n.hab&&n.kind!=='daily'&&n.kind!=='exp'){const ns=nodesFor(HAB[n.hab]).filter(m=>m.kind!=='side'),camp=ns.find(m=>m.kind==='camp'&&!st.cleared.includes(m.id));
    if(camp){const left=ns.filter(m=>m.i<=camp.i&&!st.cleared.includes(m.id)).length;out.push(goalRow('<span class="gic">'+ICON.tent+'</span>',left+' stop'+(left>1?'s':'')+' to a camp pack',(6-left)/6))}}
  const e=expState();if(e.done<5&&n.kind!=='exp')out.push(goalRow('<span class="gic">'+EMBLEM[expTheme().hab]+'</span>','Expedition '+e.done+'/5 · earns a '+CARD[expTheme().reward].name,e.done/5));
  if(n.kind==='exp'&&e.done<5)out.push(goalRow('<span class="gic">'+ART[expTheme().reward]+'</span>',(5-e.done)+' more board'+(5-e.done>1?'s':'')+' for the '+CARD[expTheme().reward].name,e.done/5));
  const v=visitorToday();if(v&&v.stop&&out.length<3)out.push(goalRow('<span class="gic">'+ART[v.id]+'</span>','A '+CARD[v.id].name+' is visiting '+HAB[v.hab].name+', stop '+NODES[v.stop].num,0));
  if(out.length<3&&n.kind==='stop')out.push(goalRow('<span class="gic">'+ICON.leaf+'</span>',(3-st.dropProg)+' new stop'+(3-st.dropProg>1?'s':'')+' until a card finds you',st.dropProg/3));
  return out.slice(0,3);
}

      if(w==='gift'){st.gift='';st.gcal.last='';delete st.daily[today()];save();closeOv();rerender();say('Daily gift and campfire reset.')}
      break}
    case 'resetAsk':ov('<div class="sheet center" role="dialog" aria-label="Reset progress"><h2>Reset all progress?</h2><p class="muted">Cards, XP, lineups and trail progress go back to the start.</p><div class="btnrow"><button class="secondary" data-act="closeOv">Keep progress</button><button class="primary" data-act="resetYes">Reset</button></div></div>');break;
    case 'resetYes':st=fresh();save();applyPrefs();closeOv();renderHome();say('All data deleted. Starting fresh.');break;
  }
});

applyPrefs();
protectStreak();
rerender();
if(st.lanternUsed){say('A lantern kept your streak alive while you were away.');st.lanternUsed=0;save()}

})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
